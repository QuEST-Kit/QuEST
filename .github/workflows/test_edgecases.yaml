# Some free, ad hoc tests which test only specific
# functions in specific regimes, covering edge cases.
# These are intended as a stop gap in the interim to
# an improved test harness.
# 
# @author Tyson Jones

name: test (egde cases)


on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel


jobs:

  # run only some non-parallelised v4 unit tests
  serial-unit-test:
    name: >
      ${{ startsWith(matrix.os, 'ubuntu' ) && 'Linux'   || 
          startsWith(matrix.os, 'macos'  ) && 'MacOS'   ||
          startsWith(matrix.os, 'windows') && 'Windows' ||
                                              'Unknown' }}
      ${{ endsWith(matrix.os, 'intel') && '(Intel)' || '' }}
      [${{ matrix.precision }}]
      serial
      ${{ matrix.bmi2      == 'ON' && '(BMI)'  || '' }}
      unit v${{ matrix.version }}

    runs-on: ${{ matrix.os }}

    strategy:
      # continue other jobs if any fail
      fail-fast: false

      # we will compile QuEST with all precisions but no parallelisation (though with Intel BMI2)
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, macos-15-intel, macos-26-intel]
        precision: [1, 2, 4]
        bmi2:      [ON, OFF]

        exclude:
          # cannot use BMI2 on non-Intel MacOS
          - bmi2: ON
            os: macos-latest
  
    # constants
    env:
      build_dir: "build"
      QUEST_TEST_MAX_NUM_QUBIT_PERMUTATIONS: 10
      QUEST_TEST_NUM_MIXED_DEPLOYMENT_REPETITIONS: 5

    # perform the job
    steps:
      - name: Get QuEST
        uses: actions/checkout@main

      # compile serial unit tests
      - name: Configure CMake
        run: >
          cmake -B ${{ env.build_dir }}
          -DQUEST_BUILD_TESTS=ON
          -DQUEST_ENABLE_OMP=OFF
          -DQUEST_FLOAT_PRECISION=${{ matrix.precision }}
          -DQUEST_ENABLE_BMI2=${{ matrix.bmi2 }}

      # force 'Release' build (needed by MSVC to enable optimisations)
      - name: Compile
        run: cmake --build ${{ env.build_dir }} --config Release

      - name: 8-qubit edge-cases
        run: ctest -C Release -R "Swap|CompMatr1|CompMatr2"
        working-directory: ${{ env.build_dir }}
        env:
          QUEST_TEST_NUM_QUBITS_IN_QUREG: 8



      # DEBUG: this will fail on Windows (should be like, tests\Release\tests)
      # but I want to be sure!

      - name: 12-qubit state-vector edge-cases (Unix)
        if: ${{ ! startsWith(matrix.os, 'windows') }}
        run: ./tests/tests "applyMultiStateControlledPauliStr" -c "correctness" -c "state-vector"
        working-directory: ${{ env.build_dir }}
        env:
          QUEST_TEST_NUM_QUBITS_IN_QUREG: 12

      - name: 12-qubit state-vector edge-cases (Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: ./tests/Release/tests.exe "applyMultiStateControlledPauliStr" -c "correctness" -c "state-vector"
        working-directory: ${{ env.build_dir }}
        env:
          QUEST_TEST_NUM_QUBITS_IN_QUREG: 12

