# Tests serial execution of the v4 unit tests
# (but not the larger integration tests), and
# the deprecated v3 unit tests (when possible),
# on all OS and at all precisions. All runners 
# are single-threaded and run on free runners,
# and as such use the slower, rigorous tests.
# 
# @author Tyson Jones

name: test (free, serial)


on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel


jobs:

  # run non-parallelised v3 and v4 unit tests,
  # excluding the v4 integration tests, for free
  serial-unit-test:
    name: >
      ${{ matrix.os == 'ubuntu-latest' && 'Linux' || matrix.os == 'macos-latest' && 'MacOS' || 'Windows' }}
      [${{ matrix.precision }}]
      serial
      unit v${{ matrix.version }}

    runs-on: ${{ matrix.os }}

    strategy:
      # continue other jobs if any fail
      fail-fast: false

      # we will compile QuEST with all precisions but no parallelisation
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [3, 4]
        precision: [1, 2, 4]

        # MSVC cannot compile deprecated v3 tests
        exclude:
          - os: windows-latest
            version: 3
            
    # constants
    env:
      build_dir: "build"
      depr_dir: "build/tests/deprecated"

    # perform the job
    steps:
      - name: Get QuEST
        uses: actions/checkout@main

      # compile serial unit tests, optionally include deprecated test
      - name: Configure CMake
        run: >
          cmake -B ${{ env.build_dir }}
          -DENABLE_TESTING=ON
          -DENABLE_MULTITHREADING=OFF
          -DENABLE_DEPRECATED_API=${{ matrix.version == 3 && 'ON' || 'OFF' }}
          -DDISABLE_DEPRECATION_WARNINGS=${{ matrix.version == 3 && 'ON' || 'OFF' }}
          -DFLOAT_PRECISION=${{ matrix.precision }}

      # force 'Release' build (needed by MSVC to enable optimisations)
      - name: Compile
        run: cmake --build ${{ env.build_dir }} --config Release --parallel

      # run v4 unit tests in random order, excluding the integration tests,
      # using the default environment variables (e.g. test all permutations)
      # TODO:
      # ctest currently doesn't know of our Catch2 tags, so we
      # are manually excluding each integration test by name
      - name: Run v4 tests
        if: ${{ matrix.version == 4 }}
        run: ctest -j2 --output-on-failure --schedule-random -E "density evolution"
        working-directory: ${{ env.build_dir }}

      # run v3 unit tests in random order
      - name: Run v3 tests
        if: ${{ matrix.version == 3 }}
        run: ctest -j2 --output-on-failure --schedule-random
        working-directory: ${{ env.depr_dir }}


  # run the v4 unit tests distributed over MPI, for free, using minidmr
  # (https://accelcom-bsc.github.io/DMR/user-guide/minidmr) to simulate a
  # multi-node Docker-based Slurm cluster on the single free runner. This is
  # a correctness check (not performance), mirroring the "mpi=ON, cuda=OFF"
  # combination of test_paid.yml's accel-unit-test job, but for free and on
  # every push/PR rather than only on manual dispatch.
  distributed-minidmr-test:
    name: Linux [2] MPI (minidmr, 4 nodes) unit v4

    runs-on: ubuntu-latest

    # constants
    env:
      build_dir: "build"
      minidmr_nodes: 4
      test_exec: ./tests/tests

      # tests will be non-comprehensive/faster, since minidmr's 4 simulated
      # nodes share the runner's 2 real vCPUs
      num_qubit_perms: 5
      test_all_deploys: 0

    # perform the job
    steps:
      - name: Get QuEST
        uses: actions/checkout@main

      - name: Install minidmr
        run: |
          curl -fsSL https://gitlab.bsc.es/accelcom/releases/dmr/tools/minidmr/-/raw/master/scripts/install.sh | bash -s -- --install-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Docker is preinstalled and running on GitHub-hosted ubuntu-latest runners
      - name: Start minidmr cluster
        run: minidmr start --nodes ${{ env.minidmr_nodes }}

      # minidmr bind-mounts the checkout (the current working directory)
      # into every container at the same path, so no copying is needed
      - name: Configure and compile QuEST (inside minidmr controller)
        run: |
          minidmr exec -- bash -lc " \
            cd '$GITHUB_WORKSPACE' && \
            cmake -B ${{ env.build_dir }} \
              -DENABLE_TESTING=ON \
              -DFLOAT_PRECISION=2 \
              -DENABLE_MULTITHREADING=OFF \
              -DENABLE_DISTRIBUTION=ON \
              -DTEST_ALL_DEPLOYMENTS=${{ env.test_all_deploys }} \
              -DTEST_MAX_NUM_QUBIT_PERMUTATIONS=${{ env.num_qubit_perms }} && \
            cmake --build ${{ env.build_dir }} --target tests --parallel \
          "

      # cannot use ctest when distributed. mpirun launches ranks over SSH
      # inside the Docker network (--prtemca ras/plm ^slurm, because PRRTE
      # refuses the image's too-old native Slurm integration), so env vars
      # must be forwarded explicitly with -x or remote ranks silently run
      # with different (default) test configuration than the local rank
      - name: Run distributed v4 tests (minidmr, 4 simulated nodes)
        run: |
          minidmr srun \
            -e TEST_MAX_NUM_QUBIT_PERMUTATIONS=${{ env.num_qubit_perms }} \
            -e TEST_ALL_DEPLOYMENTS=${{ env.test_all_deploys }} \
            -- -N ${{ env.minidmr_nodes }} -n ${{ env.minidmr_nodes }} bash -c ' \
              if [ "$SLURM_PROCID" -eq 0 ]; then \
                NODELIST_WITH_COUNTS=$(scontrol show hostnames "$SLURM_JOB_NODELIST" | awk "{print \$1\":1\"}" | paste -sd, -); \
                mpirun --prtemca ras ^slurm --prtemca plm ^slurm \
                  -x TEST_ALL_DEPLOYMENTS -x TEST_MAX_NUM_QUBIT_PERMUTATIONS \
                  --host "$NODELIST_WITH_COUNTS" -np ${{ env.minidmr_nodes }} \
                  ${{ env.test_exec }}; \
                exit $?; \
              else \
                exit 0; \
              fi \
            '

      - name: Stop minidmr cluster
        if: always()
        run: minidmr stop
